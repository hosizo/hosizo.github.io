name: Enforce custom-domain HTTPS

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write

jobs:
  enforce:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Enable HTTPS when the certificate is ready
        id: enforce
        shell: bash
        run: |
          if gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -F https_enforced=true; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Certificate is not ready yet; the next scheduled run will retry."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify and stop the temporary monitor
        if: steps.enforce.outputs.enabled == 'true'
        shell: bash
        run: |
          curl --fail --silent --show-error --head https://record.hosizo.cn/
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/enforce-https.yml/disable"
